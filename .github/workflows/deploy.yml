name: CloudGov CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # Backend Validation
      # ------------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx pytest

      - name: Verify Python Syntax & Schema Initialization
        run: |
          python -m compileall backend/app
          python -c "
          import sys
          sys.path.insert(0, 'backend')
          from app.main import app
          print('FastAPI application initialized successfully.')
          "

      # ------------------------------------------------------------------------
      # Frontend Validation
      # ------------------------------------------------------------------------
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React SPA
        working-directory: ./frontend
        run: npm run build

  deploy-to-ec2:
    name: Continuous Deployment to AWS EC2
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute Deployment on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            echo "==> Triggering CloudGov automated deployment..."
            chmod +x /home/ubuntu/cloudgov/scripts/deploy.sh
            /home/ubuntu/cloudgov/scripts/deploy.sh
